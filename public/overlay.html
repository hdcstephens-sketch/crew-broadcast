<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, initial-scale=1.0, maximum-scale=1.0">
  <title>OBS Overlay</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Crimson+Pro:ital,wght@0,400;1,400&family=Inter:wght@500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 1920px; height: 1080px;
      overflow: hidden; background: transparent;
    }

    #overlay-root {
      position: relative;
      width: 1920px; height: 1080px;
      transform-origin: top left;
    }

    /* ── race bar ────────────────────────────────────────────── */
    #ov-racebar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 88px;
      visibility: hidden;
    }

    .rb-inner {
      position: absolute; inset: 0;
      background: #030806;
      border-top: 3px solid #004830;
      display: flex; align-items: stretch;
    }

    /* Left school tag */
    .rb-tag {
      width: 218px; flex-shrink: 0;
      background: #004830;
      display: flex; align-items: center; justify-content: center;
      padding: 0 24px;
    }
    .rb-tag-text {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 22px; font-weight: 800;
      letter-spacing: 0.22em; text-transform: uppercase;
      color: rgba(255,255,255,0.82);
      text-align: center; line-height: 1.15;
    }

    /* Divider */
    .rb-rule {
      width: 1px; flex-shrink: 0;
      background: rgba(255,255,255,0.09);
    }

    /* Main content */
    .rb-content {
      flex: 1; min-width: 0;
      display: flex; align-items: center;
      padding: 0 56px; gap: 28px;
    }

    .rb-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 48px; font-weight: 800;
      letter-spacing: 0.025em; text-transform: uppercase;
      color: #ffffff; white-space: nowrap; line-height: 1;
    }

    .rb-sep {
      width: 1px; height: 34px; flex-shrink: 0;
      background: rgba(255,255,255,0.16);
    }

    .rb-sub {
      font-family: 'Crimson Pro', Georgia, serif;
      font-size: 24px; font-weight: 400; font-style: italic;
      letter-spacing: 0.01em;
      color: rgba(255,255,255,0.52);
      white-space: nowrap;
    }

    /* ── alert flash ─────────────────────────────────────────── */
    #ov-alert {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none; z-index: 20;
    }
    .alert-text {
      background: #004830;
      border-top: 3px solid #00c07a;
      padding: 22px 60px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 52px; font-weight: 800;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: #fff; white-space: nowrap;
    }
  </style>
</head>
<body>
<div id="overlay-root">

  <div id="ov-racebar">
    <div class="rb-inner">
      <div class="rb-tag">
        <div class="rb-tag-text" id="rb-tag">BROOKS<br>SCHOOL</div>
      </div>
      <div class="rb-rule"></div>
      <div class="rb-content">
        <div class="rb-name" id="rb-name">BOYS VARSITY 1X</div>
        <div class="rb-sep" id="rb-sep"></div>
        <div class="rb-sub" id="rb-sub">Spring Invitational 2026</div>
      </div>
    </div>
  </div>

  <div id="ov-alert"><div class="alert-text" id="ov-at"></div></div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
'use strict';

// ── scale to viewport ──────────────────────────────────────────────────
(function() {
  const root = document.getElementById('overlay-root');
  function fit() {
    root.style.transform = `scale(${Math.min(window.innerWidth / 1920, window.innerHeight / 1080)})`;
  }
  window.addEventListener('resize', fit);
  fit();
})();

// ── bar show / hide ────────────────────────────────────────────────────
function showBar() {
  const el = document.getElementById('ov-racebar');
  gsap.killTweensOf(el);
  el.style.visibility = 'visible';
  gsap.fromTo(el, { y: 88 }, { y: 0, duration: 0.44, ease: 'power3.out', clearProps: 'y' });
}

function hideBar() {
  const el = document.getElementById('ov-racebar');
  gsap.killTweensOf(el);
  gsap.to(el, {
    y: 88, duration: 0.3, ease: 'power2.in',
    onComplete: () => { el.style.visibility = 'hidden'; gsap.set(el, { clearProps: 'y' }); }
  });
}

// ── content ────────────────────────────────────────────────────────────
function applyContent(state) {
  if (!state) return;

  if (state.eventHeader !== undefined) {
    const name = (state.eventHeader?.text || '').toUpperCase();
    const sub  = state.eventHeader?.subtitle || '';
    document.getElementById('rb-name').textContent = name;
    document.getElementById('rb-sub').textContent  = sub;
    document.getElementById('rb-sep').style.display = sub ? '' : 'none';
  }

  if (state.watermark?.text) {
    // Derive a 2-line tag from the team name (e.g. "Brooks School" → "BROOKS\nSCHOOL")
    const words = state.watermark.text.trim().split(/\s+/);
    document.getElementById('rb-tag').innerHTML =
      words.length > 1
        ? `${esc(words.slice(0,-1).join(' '))}<br>${esc(words[words.length-1])}`
        : esc(words[0] || 'CREW');
  }
}

// ── alert ──────────────────────────────────────────────────────────────
let alertTimer = null;
function showAlert(text, duration) {
  const el = document.getElementById('ov-alert');
  document.getElementById('ov-at').textContent = (text || '').toUpperCase();
  if (alertTimer) clearTimeout(alertTimer);
  gsap.killTweensOf(el);
  gsap.fromTo(el,
    { opacity: 0, y: -16 },
    { opacity: 1, y: 0, duration: 0.32, ease: 'power3.out' }
  );
  alertTimer = setTimeout(() =>
    gsap.to(el, { opacity: 0, y: -10, duration: 0.4, ease: 'power2.in' }),
    Math.max(1, duration || 3) * 1000
  );
}

// ── timer (reference only — not shown, keeps server state in sync) ─────
let timerRunning = false, timerStart = null;

// ── websocket ──────────────────────────────────────────────────────────
let ws;

function connect() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}`);
  ws.onopen  = () => ws.send(JSON.stringify({ type: 'register', role: 'overlay' }));
  ws.onclose = () => setTimeout(connect, 3000);
  ws.onerror = () => {};
  ws.onmessage = e => { try { handle(JSON.parse(e.data)); } catch {} };
}

function handle(msg) {
  switch (msg.type) {

    case 'state': {
      const s = msg.overlayState;
      if (!s) return;
      if (s.eventHeader?.active) showBar(); else hideBar();
      applyContent(s);
      if (s.timer?.running && s.timer?.startTime) {
        timerRunning = true; timerStart = s.timer.startTime;
      }
      break;
    }

    case 'toggle':
      if (msg.element === 'eventHeader') {
        if (msg.active) showBar(); else hideBar();
      }
      break;

    case 'save-widgets':
      // server echoes back as a state broadcast
      break;

    case 'update':
      if (msg.element && msg.data) applyContent({ [msg.element]: msg.data });
      break;

    case 'timer-control':
      if (msg.action === 'start') { timerRunning = true; timerStart = Date.now() - (msg.elapsed || 0); }
      else { timerRunning = false; }
      break;

    case 'alert':
      showAlert(msg.text, msg.duration);
      break;
  }
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

connect();
</script>
</body>
</html>
