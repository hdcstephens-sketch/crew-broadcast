<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, initial-scale=1.0, maximum-scale=1.0">
  <title>OBS Overlay</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Crimson+Pro:ital,wght@0,300;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 1920px; height: 1080px;
      overflow: hidden; background: transparent;
    }

    #overlay-root {
      position: relative;
      width: 1920px; height: 1080px;
      transform-origin: top left;
    }

    /* ══════════════════════════════════════════════════════════
       RACE BAR
    ══════════════════════════════════════════════════════════ */
    #ov-racebar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 92px;
      visibility: hidden;
    }

    /* Glowing top accent line — sits above .rb-inner so it's not clipped */
    #ov-racebar::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 2px; z-index: 20;
      background: linear-gradient(90deg,
        rgba(0,80,48,0)       0%,
        rgba(0,168,107,0.55)  8%,
        #00d87e              28%,
        #00f096              50%,
        #00d87e              72%,
        rgba(0,168,107,0.55) 92%,
        rgba(0,80,48,0)      100%
      );
      box-shadow: 0 0 14px 2px rgba(0,224,140,0.45);
      animation: glow-pulse 4s ease-in-out infinite;
    }

    @keyframes glow-pulse {
      0%, 100% { opacity: 0.8; }
      50%       { opacity: 1;   }
    }

    .rb-inner {
      position: absolute; inset: 0;
      background: #020705;
      display: flex; align-items: stretch;
      overflow: hidden;
    }

    /* Subtle top-edge colour wash inside the bar */
    .rb-inner::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 40px; z-index: 1; pointer-events: none;
      background: linear-gradient(180deg, rgba(0,168,107,0.06) 0%, transparent 100%);
    }

    /* School tag */
    .rb-tag {
      width: 220px; flex-shrink: 0; position: relative; z-index: 3;
      background: linear-gradient(160deg, #004d34 0%, #002f1d 100%);
      display: flex; align-items: center; justify-content: center;
      padding: 0 20px;
    }
    .rb-tag::after {
      content: '';
      position: absolute; right: 0; top: 12px; bottom: 12px; width: 1px;
      background: linear-gradient(180deg, transparent, rgba(0,216,126,0.22) 50%, transparent);
    }
    .rb-tag-text {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 21px; font-weight: 800;
      letter-spacing: 0.22em; text-transform: uppercase;
      color: rgba(255,255,255,0.7);
      text-align: center; line-height: 1.3;
    }

    /* Content */
    .rb-content {
      flex: 1; min-width: 0; position: relative; z-index: 3;
      display: flex; align-items: center;
      padding: 0 64px; gap: 36px;
    }

    .rb-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 52px; font-weight: 900;
      letter-spacing: 0.04em; text-transform: uppercase;
      color: #ffffff; white-space: nowrap; line-height: 1;
    }

    .rb-sep {
      width: 1px; height: 32px; flex-shrink: 0;
      background: linear-gradient(180deg, transparent, rgba(255,255,255,0.18) 50%, transparent);
    }

    .rb-sub {
      font-family: 'Crimson Pro', Georgia, serif;
      font-size: 27px; font-weight: 300; font-style: italic;
      letter-spacing: 0.01em;
      color: rgba(255,255,255,0.42);
      white-space: nowrap;
    }

    /* ══════════════════════════════════════════════════════════
       ATHLETE INTRO LOWER THIRD
    ══════════════════════════════════════════════════════════ */
    #ov-intro {
      position: absolute;
      bottom: 112px; left: 0;
      visibility: hidden;
    }

    .intro-inner {
      display: flex; align-items: stretch;
      background: #020705;
      /* Diagonal top-right cut — sports broadcast feel */
      clip-path: polygon(0 0, calc(100% - 30px) 0, 100% 100%, 0 100%);
      /* Top border follows the clip boundary */
      border-top: 2px solid #00d87e;
    }

    /* Gradient left accent bar */
    .intro-accent {
      width: 7px; flex-shrink: 0;
      background: linear-gradient(180deg, #00f090 0%, #009a5e 100%);
    }

    .intro-content {
      padding: 18px 58px 18px 26px;
    }

    .intro-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 58px; font-weight: 900;
      letter-spacing: 0.04em; text-transform: uppercase;
      color: #ffffff; line-height: 1;
    }

    .intro-sub {
      font-family: 'Crimson Pro', Georgia, serif;
      font-size: 25px; font-weight: 300; font-style: italic;
      color: rgba(255,255,255,0.46);
      margin-top: 5px;
    }

    /* ══════════════════════════════════════════════════════════
       PRE-RACE GRID INTRO (F1 STYLE)
    ══════════════════════════════════════════════════════════ */
    #ov-grid {
      position: absolute; inset: 0;
      visibility: hidden; z-index: 18;
      overflow: hidden;
      background: #020705;
    }

    /* Two bg layers for cross-fading between entries */
    .grid-bg {
      position: absolute; inset: 0;
      background-size: contain; background-position: center; background-repeat: no-repeat; background-color: #020705;
      animation: grid-kb 12s ease-out forwards;
    }
    @keyframes grid-kb {
      from { transform: scale(1.0); }
      to   { transform: scale(1.1); }
    }

    /* Vignette overlays for legibility */
    .grid-vignette {
      position: absolute; inset: 0; pointer-events: none; z-index: 2;
      background:
        linear-gradient(180deg,
          rgba(2,7,5,0.2)  0%,
          transparent      28%,
          rgba(2,7,5,0.5)  62%,
          rgba(2,7,5,0.97) 100%
        ),
        linear-gradient(90deg, rgba(2,7,5,0.5) 0%, transparent 50%);
    }

    /* Top accent line — matches race bar */
    .grid-topline {
      position: absolute; top: 0; left: 0; right: 0; height: 2px; z-index: 10;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(0,168,107,0.55) 8%,
        #00d87e 28%, #00f096 50%, #00d87e 72%,
        rgba(0,168,107,0.55) 92%,
        transparent 100%
      );
      box-shadow: 0 0 14px 2px rgba(0,224,140,0.4);
    }

    /* Entry counter top-right */
    .grid-counter {
      position: absolute; top: 60px; right: 80px; z-index: 10;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 22px; font-weight: 700; letter-spacing: 0.15em;
      color: rgba(255,255,255,0.25);
    }

    /* Bottom content panel */
    .grid-panel {
      position: absolute; bottom: 44px; left: 0; right: 80px; z-index: 10;
      display: flex; align-items: center;
    }

    .grid-bar {
      width: 7px; height: 116px; flex-shrink: 0;
      background: linear-gradient(180deg, #00f090 0%, #009a5e 100%);
      margin-right: 52px;
    }

    .grid-lane-wrap {
      flex-shrink: 0; text-align: center;
      padding-right: 52px;
    }
    .grid-lane-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 14px; font-weight: 700; letter-spacing: 0.32em;
      color: #00d87e;
    }
    .grid-lane-num {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 104px; font-weight: 900; line-height: 0.88;
      color: #fff;
    }

    .grid-divider {
      width: 1px; height: 80px; flex-shrink: 0;
      background: linear-gradient(180deg, transparent, rgba(255,255,255,0.18) 50%, transparent);
      margin-right: 52px;
    }

    .grid-info { flex: 1; min-width: 0; }
    .grid-event-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 68px; font-weight: 900; letter-spacing: 0.04em;
      text-transform: uppercase; color: #fff; line-height: 1;
    }
    .grid-school-name {
      font-family: 'Crimson Pro', Georgia, serif;
      font-size: 34px; font-weight: 300; font-style: italic;
      color: rgba(255,255,255,0.46); margin-top: 8px;
    }

    /* Progress bar — bottom edge */
    .grid-progress-track {
      position: absolute; bottom: 0; left: 0; right: 0; height: 3px; z-index: 10;
      background: rgba(255,255,255,0.07);
    }
    .grid-progress-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #009a5e, #00d87e);
    }

    /* Flash-cut overlay for grid entrance */
    #grid-flash {
      position: absolute; inset: 0; z-index: 25;
      background: rgba(160,255,210,0.55);
      opacity: 0; pointer-events: none;
    }

    /* ══════════════════════════════════════════════════════════
       ALERT FLASH
    ══════════════════════════════════════════════════════════ */
    #ov-alert {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none; z-index: 20;
    }

    .alert-inner {
      position: relative;
      background: #020705;
      overflow: hidden;
    }

    /* Top glow line */
    .alert-inner::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 2px; z-index: 2;
      background: linear-gradient(90deg, transparent 5%, #00d87e 30%, #00f096 50%, #00d87e 70%, transparent 95%);
      box-shadow: 0 0 14px rgba(0,240,150,0.55);
    }

    /* Bottom hairline */
    .alert-inner::after {
      content: '';
      position: absolute; bottom: 0; left: 0; right: 0; height: 1px; z-index: 2;
      background: linear-gradient(90deg, transparent 10%, rgba(0,168,107,0.28) 40%, rgba(0,168,107,0.28) 60%, transparent 90%);
    }

    /* Subtle inner wash */
    .alert-wash {
      position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(180deg, rgba(0,168,107,0.07) 0%, transparent 55%);
    }

    .alert-text {
      position: relative; z-index: 3;
      padding: 22px 80px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 56px; font-weight: 900;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: #fff; white-space: nowrap;
    }
  </style>
</head>
<body>
<div id="overlay-root">

  <div id="ov-racebar">
    <div class="rb-inner">
      <div class="rb-tag">
        <div class="rb-tag-text" id="rb-tag">BROOKS<br>SCHOOL</div>
      </div>
      <div class="rb-content">
        <div class="rb-name" id="rb-name">BOYS VARSITY 1X</div>
        <div class="rb-sep" id="rb-sep"></div>
        <div class="rb-sub" id="rb-sub">Spring Invitational 2026</div>
      </div>
    </div>
  </div>

  <div id="ov-intro">
    <div class="intro-inner">
      <div class="intro-accent"></div>
      <div class="intro-content">
        <div class="intro-name" id="intro-name">ATHLETE NAME</div>
        <div class="intro-sub"  id="intro-sub"></div>
      </div>
    </div>
  </div>

  <!-- Pre-Race Grid Intro -->
  <div id="ov-grid">
    <div class="grid-bg" id="grid-bg-a"></div>
    <div class="grid-bg" id="grid-bg-b" style="opacity:0;"></div>
    <div class="grid-vignette"></div>
    <div class="grid-topline"></div>
    <div class="grid-counter" id="grid-counter"></div>
    <div class="grid-panel" id="grid-panel">
      <div class="grid-bar"></div>
      <div class="grid-lane-wrap">
        <div class="grid-lane-label" id="grid-lane-label">LANE</div>
        <div class="grid-lane-num" id="grid-lane-num">1</div>
      </div>
      <div class="grid-divider"></div>
      <div class="grid-info">
        <div class="grid-event-name" id="grid-event-name">BOYS VARSITY 1X</div>
        <div class="grid-school-name" id="grid-school-name">Brooks School</div>
      </div>
    </div>
    <div class="grid-progress-track">
      <div class="grid-progress-fill" id="grid-progress-fill"></div>
    </div>
    <div id="grid-flash"></div>
  </div>

  <div id="ov-alert">
    <div class="alert-inner">
      <div class="alert-wash"></div>
      <div class="alert-text" id="ov-at"></div>
    </div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
'use strict';

// ── scale to viewport ────────────────────────────────────────────────
(function() {
  const root = document.getElementById('overlay-root');
  function fit() {
    root.style.transform = `scale(${Math.min(window.innerWidth / 1920, window.innerHeight / 1080)})`;
  }
  window.addEventListener('resize', fit);
  fit();
})();

// ── race bar ─────────────────────────────────────────────────────────
function showBar() {
  const el      = document.getElementById('ov-racebar');
  const tag     = el.querySelector('.rb-tag');
  const content = el.querySelector('.rb-content');
  gsap.killTweensOf([el, tag, content]);
  el.style.visibility = 'visible';
  gsap.set(el,      { y: 0, opacity: 1 });
  gsap.set(tag,     { x: -220 });
  gsap.set(content, { clipPath: 'inset(0 100% 0 0)' });
  const tl = gsap.timeline();
  tl.to(tag,     { x: 0, duration: 0.44, ease: 'expo.out' })
    .to(content, { clipPath: 'inset(0 0% 0 0)', duration: 0.52, ease: 'expo.out' }, 0.08);
}

function hideBar() {
  const el      = document.getElementById('ov-racebar');
  const tag     = el.querySelector('.rb-tag');
  const content = el.querySelector('.rb-content');
  gsap.killTweensOf([el, tag, content]);
  gsap.set(tag,     { x: 0 });
  gsap.set(content, { clipPath: 'inset(0 0% 0 0)' });
  const tl = gsap.timeline({
    onComplete: () => { el.style.visibility = 'hidden'; gsap.set([el, tag, content], { clearProps: 'all' }); }
  });
  tl.to(content, { clipPath: 'inset(0 100% 0 0)', duration: 0.22, ease: 'power3.in' })
    .to(tag,     { x: -220, duration: 0.26, ease: 'power3.in' }, 0.04)
    .to(el,      { y: 92,   duration: 0.2,  ease: 'power2.in' }, 0.18);
}

// ── athlete intro ────────────────────────────────────────────────────
function showIntro() {
  const el     = document.getElementById('ov-intro');
  const accent = el.querySelector('.intro-accent');
  const name   = document.getElementById('intro-name');
  const sub    = document.getElementById('intro-sub');
  gsap.killTweensOf([el, accent, name, sub]);
  el.style.visibility = 'visible';
  gsap.set(el,     { opacity: 1, x: 0, clipPath: 'inset(0 100% 0 0)' });
  gsap.set(accent, { scaleY: 0, transformOrigin: 'top center' });
  gsap.set(name,   { opacity: 0, x: -18, letterSpacing: '0.18em' });
  gsap.set(sub,    { opacity: 0, y: 6 });
  const tl = gsap.timeline();
  tl.to(el,     { clipPath: 'inset(0 0% 0 0)', duration: 0.38, ease: 'expo.out' })
    .to(accent, { scaleY: 1, duration: 0.22, ease: 'power4.out' }, 0.06)
    .to(name,   { opacity: 1, x: 0, letterSpacing: '0.04em', duration: 0.32, ease: 'power3.out' }, 0.2)
    .to(sub,    { opacity: 1, y: 0, duration: 0.26, ease: 'power2.out' }, 0.34);
}

function hideIntro() {
  const el     = document.getElementById('ov-intro');
  const accent = el.querySelector('.intro-accent');
  const name   = document.getElementById('intro-name');
  const sub    = document.getElementById('intro-sub');
  gsap.killTweensOf([el, accent, name, sub]);
  gsap.set(el, { clipPath: 'inset(0 0% 0 0)' });
  gsap.to(el, {
    clipPath: 'inset(0 100% 0 0)', duration: 0.28, ease: 'power3.in',
    onComplete: () => { el.style.visibility = 'hidden'; gsap.set([el, accent, name, sub], { clearProps: 'all' }); }
  });
}

// ── content ──────────────────────────────────────────────────────────
function applyContent(state) {
  if (!state) return;

  if (state.eventHeader !== undefined) {
    const name = (state.eventHeader?.text || '').toUpperCase();
    const sub  = state.eventHeader?.subtitle || '';
    document.getElementById('rb-name').textContent = name;
    document.getElementById('rb-sub').textContent  = sub;
    document.getElementById('rb-sep').style.display = sub ? '' : 'none';
  }

  if (state.lowerThird !== undefined) {
    const name = (state.lowerThird?.text || '').toUpperCase();
    const sub  = state.lowerThird?.sub || '';
    document.getElementById('intro-name').textContent = name;
    const subEl = document.getElementById('intro-sub');
    subEl.textContent = sub;
    subEl.style.display = sub ? '' : 'none';
  }

  if (state.watermark?.text) {
    const words = state.watermark.text.trim().split(/\s+/);
    document.getElementById('rb-tag').innerHTML =
      words.length > 1
        ? `${esc(words.slice(0,-1).join(' '))}<br>${esc(words[words.length-1])}`
        : esc(words[0] || 'CREW');
  }
}

// ── alert ────────────────────────────────────────────────────────────
let alertTimer = null;
function showAlert(text, duration) {
  const el = document.getElementById('ov-alert');
  document.getElementById('ov-at').textContent = (text || '').toUpperCase();
  if (alertTimer) clearTimeout(alertTimer);
  gsap.killTweensOf(el);
  gsap.fromTo(el,
    { opacity: 0, scale: 0.94, y: -10 },
    { opacity: 1, scale: 1,    y: 0,  duration: 0.34, ease: 'power3.out' }
  );
  alertTimer = setTimeout(() =>
    gsap.to(el, { opacity: 0, scale: 0.97, y: -8, duration: 0.38, ease: 'power2.in' }),
    Math.max(1, duration || 3) * 1000
  );
}

// ── pre-race grid intro ───────────────────────────────────────────────
let gridRunning = false, gridTimer = null, gridActiveBg = 'a';

function gridStart(entries, duration) {
  if (!entries?.length) return;
  gridStop();
  gridRunning = true;
  const el    = document.getElementById('ov-grid');
  const flash = document.getElementById('grid-flash');
  el.style.visibility = 'visible';
  gsap.set(el, { opacity: 1 });
  gsap.set(flash, { opacity: 0.85 });
  gsap.to(flash, { opacity: 0, duration: 0.55, ease: 'power2.out' });
  gsap.fromTo('.grid-topline',
    { scaleX: 0, transformOrigin: 'left center' },
    { scaleX: 1, duration: 0.75, ease: 'expo.out' }
  );
  gridPlayEntry(entries, 0, duration);
}

function gridPlayEntry(entries, idx, duration) {
  if (!gridRunning) return;
  if (idx >= entries.length) { gridEnd(); return; }

  const entry = entries[idx];

  // Cross-fade backgrounds
  const next   = gridActiveBg === 'a' ? 'b' : 'a';
  const nextEl = document.getElementById('grid-bg-' + next);
  const curEl  = document.getElementById('grid-bg-' + gridActiveBg);
  nextEl.style.backgroundImage = entry.image ? `url("${escUrl(entry.image)}")` : 'none';
  nextEl.style.animation = 'none';
  void nextEl.offsetWidth;
  nextEl.style.animation = '';
  gsap.set(nextEl, { opacity: 0 });
  gsap.to(nextEl, { opacity: 1, duration: 0.8, ease: 'power2.inOut' });
  gsap.to(curEl,  { opacity: 0, duration: 0.8, ease: 'power2.inOut' });
  gridActiveBg = next;

  // Counter — pop in with scale bounce
  const counter = document.getElementById('grid-counter');
  counter.textContent = (idx + 1) + ' • ' + entries.length;
  gsap.fromTo(counter, { scale: 1.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: 'back.out(2)' });

  const panel      = document.getElementById('grid-panel');
  const bar        = panel.querySelector('.grid-bar');
  const laneLabel  = document.getElementById('grid-lane-label');
  const laneNum    = document.getElementById('grid-lane-num');
  const divider    = panel.querySelector('.grid-divider');
  const eventName  = document.getElementById('grid-event-name');
  const schoolName = document.getElementById('grid-school-name');
  const targetLane = Number(entry.lane || idx + 1);

  function updateText() {
    laneLabel.textContent  = (entry.laneLabel || 'LANE').toUpperCase();
    eventName.textContent  = (entry.name || '').toUpperCase();
    schoolName.textContent = entry.school || '';
  }

  function countLane(from, to) {
    const obj = { v: from };
    gsap.to(obj, { v: to, duration: 0.45, ease: 'power2.out',
      onUpdate: () => { laneNum.textContent = Math.round(obj.v); } });
  }

  // Progress bar
  const fill = document.getElementById('grid-progress-fill');
  gsap.set(fill, { width: '0%' });
  gsap.to(fill, { width: '100%', duration: duration / 1000, ease: 'none' });

  if (idx === 0) {
    updateText();
    laneNum.textContent = '0';
    gsap.set(bar,        { scaleY: 0, transformOrigin: 'top center' });
    gsap.set(panel,      { opacity: 1, x: 0, y: 0 });
    gsap.set(laneLabel,  { opacity: 0 });
    gsap.set(laneNum,    { opacity: 0 });
    gsap.set(divider,    { opacity: 0, scaleY: 0, transformOrigin: 'center center' });
    gsap.set(eventName,  { opacity: 0, clipPath: 'inset(0 100% 0 0)' });
    gsap.set(schoolName, { opacity: 0, y: 10 });

    const tl = gsap.timeline();
    tl.to(bar,        { scaleY: 1, duration: 0.32, ease: 'power4.out' })
      .to(laneLabel,  { opacity: 1, duration: 0.2 }, 0.1)
      .to(laneNum,    { opacity: 1, duration: 0.15 }, 0.14)
      .add(() => countLane(0, targetLane), 0.14)
      .to(divider,    { opacity: 1, scaleY: 1, duration: 0.28, ease: 'power3.out' }, 0.2)
      .to(eventName,  { opacity: 1, clipPath: 'inset(0 0% 0 0)', duration: 0.45, ease: 'expo.out' }, 0.26)
      .to(schoolName, { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out' }, 0.44);
  } else {
    const prevLane = Number(laneNum.textContent) || idx;
    gsap.to(panel, {
      x: -80, opacity: 0, duration: 0.24, ease: 'power2.in',
      onComplete: () => {
        updateText();
        laneNum.textContent = String(prevLane);
        gsap.set(eventName, { clipPath: 'inset(0 100% 0 0)' });
        gsap.set(panel, { x: 70 });
        gsap.to(panel, { x: 0, opacity: 1, duration: 0.4, ease: 'power3.out' });
        gsap.to(eventName, { clipPath: 'inset(0 0% 0 0)', duration: 0.4, ease: 'expo.out', delay: 0.06 });
        countLane(prevLane, targetLane);
      }
    });
  }

  gridTimer = setTimeout(() => gridPlayEntry(entries, idx + 1, duration), duration);
}

function gridEnd() {
  gridRunning = false;
  if (gridTimer) { clearTimeout(gridTimer); gridTimer = null; }
  const el = document.getElementById('ov-grid');
  gsap.to(el, {
    opacity: 0, duration: 0.7, ease: 'power2.in',
    onComplete: () => { el.style.visibility = 'hidden'; gsap.set(el, { opacity: 1 }); }
  });
}

function gridStop() {
  gridRunning = false;
  if (gridTimer) { clearTimeout(gridTimer); gridTimer = null; }
  const el    = document.getElementById('ov-grid');
  const panel = document.getElementById('grid-panel');
  gsap.killTweensOf(el);
  gsap.killTweensOf(panel);
  gsap.killTweensOf(panel.querySelectorAll('*'));
  gsap.killTweensOf('.grid-topline');
  gsap.killTweensOf(document.getElementById('grid-counter'));
  el.style.visibility = 'hidden';
  gsap.set(el,    { clearProps: 'all' });
  gsap.set(panel, { clearProps: 'all' });
  gsap.set('.grid-topline', { clearProps: 'all' });
}

function escUrl(s) {
  return String(s || '').replace(/"/g, '%22');
}

// ── timer ref ────────────────────────────────────────────────────────
let timerRunning = false, timerStart = null;

// ── websocket ────────────────────────────────────────────────────────
let ws;

function connect() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}`);
  ws.onopen  = () => ws.send(JSON.stringify({ type: 'register', role: 'overlay' }));
  ws.onclose = () => setTimeout(connect, 3000);
  ws.onerror = () => {};
  ws.onmessage = e => { try { handle(JSON.parse(e.data)); } catch {} };
}

function handle(msg) {
  switch (msg.type) {

    case 'state': {
      const s = msg.overlayState;
      if (!s) return;
      if (s.eventHeader?.active) showBar(); else hideBar();
      if (s.lowerThird?.active) showIntro(); else hideIntro();
      applyContent(s);
      if (s.timer?.running && s.timer?.startTime) {
        timerRunning = true; timerStart = s.timer.startTime;
      }
      break;
    }

    case 'toggle':
      if (msg.element === 'eventHeader') { if (msg.active) showBar();  else hideBar();  }
      if (msg.element === 'lowerThird')  { if (msg.active) showIntro(); else hideIntro(); }
      break;

    case 'save-widgets':
      break;

    case 'update':
      if (msg.element && msg.data) applyContent({ [msg.element]: msg.data });
      break;

    case 'timer-control':
      if (msg.action === 'start') { timerRunning = true; timerStart = Date.now() - (msg.elapsed || 0); }
      else { timerRunning = false; }
      break;

    case 'alert':
      showAlert(msg.text, msg.duration);
      break;

    case 'grid-start':
      gridStart(msg.entries, msg.duration);
      break;

    case 'grid-stop':
      gridStop();
      break;
  }
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

connect();
</script>
