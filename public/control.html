<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CREW — Control</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #060c09;
      --card:       #0f1510;
      --card2:      #161e18;
      --accent:     #00a86b;
      --accent-dim: rgba(0,168,107,0.14);
      --danger:     #e53935;
      --text:       #f0f0f0;
      --text2:      #8a9a90;
      --line:       rgba(255,255,255,0.07);
      --r:          14px;
    }

    body {
      background: var(--bg); color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh; padding-bottom: 60px;
    }

    /* ── top bar ── */
    .topbar {
      width: 100%; position: sticky; top: 0; z-index: 50;
      background: rgba(6,12,9,0.97); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; gap: 10px;
    }
    .topbar-brand {
      font-family: 'Rajdhani', sans-serif; font-size: 17px; font-weight: 700;
      letter-spacing: 0.06em; color: var(--accent);
    }
    .topbar-right { display: flex; align-items: center; gap: 8px; }
    .pill {
      font-size: 12px; font-weight: 600; padding: 5px 11px;
      border-radius: 999px; border: 1px solid var(--line);
      color: var(--text2); text-decoration: none; background: var(--card);
      white-space: nowrap;
    }
    .pill:hover { border-color: var(--accent); color: var(--accent); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #444; flex-shrink: 0; }
    .dot.live { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
    .dot.err  { background: var(--danger); }
    #wsLabel { font-size: 12px; color: var(--text2); display: flex; align-items: center; gap: 6px; }

    /* ── page ── */
    .page { max-width: 480px; margin: 0 auto; padding: 20px 14px; display: flex; flex-direction: column; gap: 20px; }

    /* ── section ── */
    .sec-label {
      font-size: 10px; font-weight: 700; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--text2); margin-bottom: 10px;
    }
    .card {
      background: var(--card); border: 1px solid var(--line);
      border-radius: var(--r); padding: 16px;
    }

    /* ── active race display ── */
    .active-race-box {
      background: var(--card); border: 1px solid var(--line);
      border-radius: var(--r); padding: 18px 20px;
      border-left: 4px solid var(--accent);
    }
    .active-race-name {
      font-family: 'Rajdhani', sans-serif; font-size: 28px; font-weight: 700;
      letter-spacing: 0.04em; text-transform: uppercase; color: var(--text);
      line-height: 1.1;
    }
    .active-race-sub { font-size: 13px; color: var(--text2); margin-top: 4px; }

    /* ── race list ── */
    .race-btn {
      width: 100%; text-align: left; padding: 11px 14px;
      background: var(--card2); border: 1px solid var(--line);
      border-radius: 10px; color: var(--text); font-size: 13px; font-weight: 600;
      cursor: pointer; font-family: inherit; transition: 0.13s;
      display: flex; align-items: center; gap: 8px;
    }
    .race-btn:hover { border-color: var(--accent); color: var(--accent); }
    .race-btn.is-active { border-color: var(--accent); background: var(--accent-dim); color: var(--accent); }
    .race-btn .race-sub { font-size: 11px; color: var(--text2); font-weight: 400; margin-left: auto; white-space: nowrap; }
    .race-btn.is-active .race-sub { color: var(--accent); opacity: 0.7; }
    .race-del {
      background: none; border: none; color: var(--danger); opacity: 0.5;
      font-size: 16px; cursor: pointer; line-height: 1; padding: 0 2px; flex-shrink: 0;
    }
    .race-del:hover { opacity: 1; }
    .empty-row {
      font-size: 12px; color: var(--text2); padding: 12px;
      text-align: center; border: 1px dashed var(--line); border-radius: 10px;
    }

    /* ── mode buttons ── */
    .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .mode-btn {
      padding: 18px 8px; border-radius: var(--r); border: 1px solid var(--line);
      background: var(--card); color: var(--text2);
      font-family: 'Rajdhani', sans-serif; font-size: 16px; font-weight: 700;
      letter-spacing: 0.08em; cursor: pointer; transition: 0.15s; text-align: center;
    }
    .mode-btn:hover { border-color: var(--accent); color: var(--text); }
    .mode-btn.is-active-on {
      background: var(--accent); border-color: var(--accent); color: #fff;
    }
    .mode-btn.is-active-off {
      border-color: rgba(255,255,255,0.18); background: rgba(255,255,255,0.05); color: var(--text);
    }

    /* ── timer ── */
    .timer-display {
      font-family: 'Rajdhani', sans-serif; font-size: 68px; font-weight: 700;
      line-height: 1; color: var(--text); letter-spacing: 0.02em;
      text-align: center; padding: 10px 0 14px;
    }
    .timer-display .sub { font-size: 40px; color: var(--text2); }
    .btn-row { display: flex; gap: 8px; }
    .btn {
      flex: 1; padding: 12px 8px; border-radius: 12px; border: 1px solid var(--line);
      background: var(--card2); color: var(--text); font-size: 14px; font-weight: 600;
      font-family: inherit; cursor: pointer; transition: 0.13s; text-align: center;
    }
    .btn:hover   { border-color: var(--accent); }
    .btn:disabled { opacity: 0.3; pointer-events: none; }
    .btn-go  { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-go:hover { background: #00c07a; }
    .btn-stop { background: rgba(229,57,53,0.14); border-color: rgba(229,57,53,0.4); color: #ef9a9a; }
    .btn-stop:hover { background: rgba(229,57,53,0.26); }
    .btn-icon { flex: none; width: 46px; height: 46px; font-size: 20px; padding: 0; border-radius: 12px; display: flex; align-items: center; justify-content: center; }

    /* ── quick inputs ── */
    .quick-input {
      width: 100%; background: var(--card2); border: 1px solid var(--line);
      border-radius: 10px; padding: 10px 12px; color: var(--text);
      font-size: 14px; font-family: inherit; outline: none; margin-bottom: 8px;
    }
    .quick-input:focus { border-color: var(--accent); }
    .quick-input::placeholder { color: var(--text2); }
    .quick-input:last-child { margin-bottom: 0; }

    /* ── action button ── */
    .action-btn {
      padding: 10px 16px; border-radius: 11px; border: 1px solid var(--accent);
      background: var(--accent-dim); color: var(--accent);
      font-size: 13px; font-weight: 600; font-family: inherit;
      cursor: pointer; transition: 0.13s;
    }
    .action-btn:hover { background: var(--accent); color: #fff; }
    .action-btn.ghost { border-color: var(--line); background: var(--card2); color: var(--text2); }
    .action-btn.ghost:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
    .action-btn.full { width: 100%; text-align: center; padding: 13px; font-size: 14px; }

    /* ── schedule (collapsed) ── */
    .collapse-btn {
      width: 100%; padding: 13px 16px; background: var(--card); border: 1px solid var(--line);
      border-radius: var(--r); color: var(--text2); font-size: 13px; font-weight: 600;
      cursor: pointer; text-align: left; display: flex; align-items: center; justify-content: space-between;
      font-family: inherit;
    }
    .collapse-btn:hover { color: var(--text); border-color: var(--accent); }
    .collapse-body { padding-top: 16px; display: flex; flex-direction: column; gap: 14px; }
    .collapse-body.hidden { display: none; }

    /* ── toasts ── */
    #toasts { position: fixed; bottom: 16px; right: 16px; display: flex; flex-direction: column; gap: 6px; z-index: 999; }
    .toast { padding: 10px 14px; border-radius: 10px; font-size: 13px; font-weight: 600; color: #fff; }
    .toast.ok  { background: var(--accent); }
    .toast.err { background: var(--danger); }

    /* ── preview modal ── */
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 300; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .modal-inner { width: 100%; max-width: 960px; }
    .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .modal-close { background: none; border: none; color: var(--text2); font-size: 24px; cursor: pointer; line-height: 1; }
    .preview-aspect { width: 100%; aspect-ratio: 16/9; position: relative; overflow: hidden; border-radius: 12px; background: #000; border: 1px solid var(--line); }
    .preview-aspect iframe { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; border: none; transform-origin: 0 0; }

    @media (max-width: 420px) {
      .mode-grid { grid-template-columns: 1fr 1fr 1fr; }
      .alert-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand" id="brandName">CREW</div>
  <div class="topbar-right">
    <span id="wsLabel"><span class="dot" id="wsDot"></span>Connecting</span>
    <a class="pill" href="/audio.html">Mic</a>
    <a class="pill" href="/monitor.html" target="_blank">Monitor ↗</a>
    <button class="pill" onclick="openPreview()" style="cursor:pointer;">Preview</button>
    <button class="pill" onclick="logout()" style="cursor:pointer;border-color:rgba(229,57,53,0.4);color:#ef9a9a;">Out</button>
  </div>
</div>

<div class="page">

  <!-- ── 1. Current Race ─────────────────────────────────── -->
  <div>
    <div class="sec-label">Current Race</div>
    <div class="active-race-box" id="activeRaceBox">
      <div class="active-race-name" id="activeRaceName">No race selected</div>
      <div class="active-race-sub" id="activeRaceSub">Tap a race below to load it</div>
    </div>
    <div id="raceList" style="display:flex;flex-direction:column;gap:6px;margin-top:10px;"></div>
  </div>

  <!-- ── 2. Mode ──────────────────────────────────────────── -->
  <div>
    <div class="sec-label">Bar</div>
    <div class="mode-grid">
      <button class="mode-btn" id="mode-on" onclick="setMode('on')">BAR ON</button>
      <button class="mode-btn" id="mode-off" onclick="setMode('off')">BAR OFF</button>
    </div>
  </div>

  <!-- ── 3. Timer ─────────────────────────────────────────── -->
  <div class="card">
    <div class="sec-label" style="margin-bottom:0;">Race Timer</div>
    <div class="timer-display" id="timerDisp">00:00<span class="sub">.0</span></div>
    <div class="btn-row">
      <button class="btn btn-go"   id="tStartBtn" onclick="tStart()">Start</button>
      <button class="btn btn-stop" id="tStopBtn"  onclick="tStop()" disabled>Stop</button>
      <button class="btn btn-icon" onclick="tReset()" title="Reset">↺</button>
    </div>
  </div>

  <!-- ── 4. Schedule ──────────────────────────────────────── -->
  <div>
    <button class="collapse-btn" onclick="toggleSchedule(this)">
      <span>Manage Schedule</span><span id="schedArrow">▼</span>
    </button>
    <div class="collapse-body hidden" id="schedBody">

      <div style="display:flex;flex-direction:column;gap:6px;">
        <input class="quick-input" id="newRaceName" placeholder="Race name — e.g. Boys Varsity 1x">
        <input class="quick-input" id="newRaceSub"  placeholder="Subtitle — e.g. Spring Invitational 2026">
        <button class="action-btn ghost" style="align-self:flex-start;" onclick="addRace()">+ Add Race</button>
      </div>

      <div id="schedList" style="display:flex;flex-direction:column;gap:6px;"></div>

    </div>
  </div>

</div>

<div id="toasts"></div>

<!-- Preview modal -->
<div id="previewModal" style="display:none;" class="modal-bg" onclick="if(event.target===this)closePreview()">
  <div class="modal-inner">
    <div class="modal-head">
      <div style="font-size:14px;font-weight:700;">Overlay Preview</div>
      <button class="modal-close" onclick="closePreview()">✕</button>
    </div>
    <div class="preview-aspect" id="previewContainer">
      <iframe id="previewFrame" src="/overlay.html" scrolling="no"></iframe>
    </div>
  </div>
</div>

<script>
// ── auth ──────────────────────────────────────────────────────────────
const token = localStorage.getItem('crew_token');
const user  = JSON.parse(localStorage.getItem('crew_user') || 'null');
if (!token || !user) location.href = `/?next=${encodeURIComponent(location.pathname)}`;
if (user && user.role !== 'admin') location.href = user.role === 'coach' ? '/audio.html' : '/';
if (user?.teamName) document.getElementById('brandName').textContent = user.teamName.toUpperCase();

// ── state ─────────────────────────────────────────────────────────────
let ws;
let raceSchedule = [];
let activeRaceIdx = null;
let currentMode   = null;
let timerRunning  = false, timerStart = null, timerElapsed = 0, timerIv = null;
let schedOpen     = false;

// ── websocket ─────────────────────────────────────────────────────────
function wsConnect() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}`);
  ws.onopen  = () => ws.send(JSON.stringify({ type: 'auth', token }));
  ws.onclose = () => { setWsStatus(false); setTimeout(wsConnect, 3000); };
  ws.onerror = () => {};
  ws.onmessage = e => { try { onMsg(JSON.parse(e.data)); } catch {} };
}

function send(obj) { if (ws?.readyState === 1) ws.send(JSON.stringify(obj)); }

function onMsg(msg) {
  if (msg.type === 'auth-ok') { setWsStatus(true); }
  if (msg.type === 'auth-fail') { localStorage.clear(); location.href = '/'; }
  if (msg.type === 'state') {
    if (Array.isArray(msg.raceSchedule)) { raceSchedule = msg.raceSchedule; renderSchedule(); }
    if (msg.overlayState) applyServerState(msg.overlayState);
  }
  if (msg.type === 'race-schedule') { raceSchedule = msg.schedule || []; renderSchedule(); }
  if (msg.type === 'timer-control') syncTimer(msg);
}

function setWsStatus(ok) {
  document.getElementById('wsDot').className = 'dot ' + (ok ? 'live' : 'err');
  document.getElementById('wsLabel').innerHTML =
    `<span class="dot ${ok ? 'live' : 'err'}" id="wsDot"></span>${ok ? 'Live' : 'Reconnecting…'}`;
}

// ── server state sync ─────────────────────────────────────────────────
function applyServerState(s) {
  if (s.timer) {
    timerElapsed = s.timer.elapsed || 0;
    if (s.timer.running && s.timer.startTime) {
      timerStart = s.timer.startTime; timerRunning = true; runTimer();
    } else {
      stopTimerLocal(); updateTimerDisp(timerElapsed);
    }
  }
  setModeLocal(s.eventHeader?.active ? 'on' : 'off');
}

// ── mode ──────────────────────────────────────────────────────────────
function setMode(mode) {
  const on = mode === 'on';
  send({ type: 'save-widgets', widgets: {
    eventHeader: on, timer: false, lanes: false, results: false,
    strokeRate: false, distance: false, lowerThird: false, conditions: false,
    schoolLogos: false, watermark: false, countdown: false
  }});
  setModeLocal(mode);
  toast(on ? 'Bar on' : 'Bar off', 'ok');
}

function setModeLocal(mode) {
  currentMode = mode;
  ['on', 'off'].forEach(m => {
    const btn = document.getElementById('mode-' + m);
    if (!btn) return;
    btn.className = 'mode-btn' + (mode === m ? ' is-active-' + m : '');
  });
}

// ── timer ─────────────────────────────────────────────────────────────
function updateTimerDisp(ms) {
  const m = Math.floor(ms / 60000);
  const s = Math.floor((ms % 60000) / 1000);
  const t = Math.floor((ms % 1000) / 100);
  document.getElementById('timerDisp').innerHTML =
    `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}<span class="sub">.${t}</span>`;
}

function runTimer() {
  clearInterval(timerIv);
  document.getElementById('tStartBtn').disabled = true;
  document.getElementById('tStopBtn').disabled  = false;
  timerIv = setInterval(() => updateTimerDisp(Date.now() - timerStart), 100);
}

function stopTimerLocal() {
  clearInterval(timerIv); timerRunning = false;
  document.getElementById('tStartBtn').disabled = false;
  document.getElementById('tStopBtn').disabled  = true;
}

function syncTimer(msg) {
  if (msg.action === 'start') {
    timerStart = Date.now() - (msg.elapsed || 0); timerRunning = true; runTimer();
  } else if (msg.action === 'stop') {
    timerElapsed = msg.elapsed || 0; stopTimerLocal(); updateTimerDisp(timerElapsed);
  } else if (msg.action === 'reset') {
    timerElapsed = 0; stopTimerLocal(); updateTimerDisp(0);
  }
}

function tStart() {
  timerStart = Date.now() - timerElapsed; timerRunning = true; runTimer();
  send({ type: 'timer-control', action: 'start', elapsed: timerElapsed });
}
function tStop() {
  timerElapsed = Date.now() - timerStart; stopTimerLocal(); updateTimerDisp(timerElapsed);
  send({ type: 'timer-control', action: 'stop', elapsed: timerElapsed });
}
function tReset() {
  timerElapsed = 0; stopTimerLocal(); updateTimerDisp(0);
  send({ type: 'timer-control', action: 'reset' });
}

// ── race schedule ─────────────────────────────────────────────────────
function renderSchedule() {
  const list = document.getElementById('raceList');
  const sched = document.getElementById('schedList');
  if (!raceSchedule.length) {
    list.innerHTML  = '<div class="empty-row">No races in schedule — add below</div>';
    sched.innerHTML = '<div class="empty-row">No races yet.</div>';
    return;
  }
  list.innerHTML = raceSchedule.map((r, i) => `
    <div style="display:flex;gap:6px;align-items:center;">
      <button class="race-btn${activeRaceIdx === i ? ' is-active' : ''}" onclick="loadRace(${i})" style="flex:1;">
        <span>${escAttr(r.name)}</span>
        ${r.sub ? `<span class="race-sub">${escAttr(r.sub)}</span>` : ''}
      </button>
    </div>
  `).join('');
  sched.innerHTML = raceSchedule.map((r, i) => `
    <div style="display:flex;gap:6px;align-items:center;">
      <span style="flex:1;font-size:13px;font-weight:600;padding:8px 0;">${escAttr(r.name)}${r.sub ? `<span style="color:var(--text2);font-weight:400;font-size:11px;margin-left:6px;">${escAttr(r.sub)}</span>` : ''}</span>
      <button class="race-del" onclick="removeRace(${i})">×</button>
    </div>
  `).join('');
}

function loadRace(i) {
  const race = raceSchedule[i];
  if (!race) return;
  activeRaceIdx = i;
  document.getElementById('activeRaceName').textContent = race.name;
  document.getElementById('activeRaceSub').textContent  = race.sub || '';
  send({ type: 'update', element: 'eventHeader', data: { text: race.name, subtitle: race.sub || '' } });
  renderSchedule();
  toast('Loaded: ' + race.name, 'ok');
}

function addRace() {
  const name = document.getElementById('newRaceName').value.trim();
  if (!name) return;
  raceSchedule.push({ name, sub: document.getElementById('newRaceSub').value.trim() });
  send({ type: 'race-schedule-save', schedule: raceSchedule });
  document.getElementById('newRaceName').value = '';
  document.getElementById('newRaceSub').value  = '';
  renderSchedule();
}

function removeRace(i) {
  if (activeRaceIdx === i) activeRaceIdx = null;
  else if (activeRaceIdx > i) activeRaceIdx--;
  raceSchedule.splice(i, 1);
  send({ type: 'race-schedule-save', schedule: raceSchedule });
  renderSchedule();
}

function toggleSchedule(btn) {
  schedOpen = !schedOpen;
  document.getElementById('schedBody').classList.toggle('hidden', !schedOpen);
  document.getElementById('schedArrow').textContent = schedOpen ? '▲' : '▼';
}

// ── preview ───────────────────────────────────────────────────────────
function openPreview() {
  document.getElementById('previewModal').style.display = 'flex';
  const c = document.getElementById('previewContainer');
  document.getElementById('previewFrame').style.transform = `scale(${c.offsetWidth / 1920})`;
}
function closePreview() { document.getElementById('previewModal').style.display = 'none'; }
window.addEventListener('resize', () => {
  const c = document.getElementById('previewContainer');
  const f = document.getElementById('previewFrame');
  if (c && f) f.style.transform = `scale(${c.offsetWidth / 1920})`;
});

// ── utils ─────────────────────────────────────────────────────────────
function escAttr(v) {
  return String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function toast(msg, type) {
  const el = document.createElement('div');
  el.className = 'toast ' + (type || 'ok');
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 2400);
}
function logout() {
  localStorage.removeItem('crew_token');
  localStorage.removeItem('crew_user');
  location.href = '/';
}

// ── keyboard shortcuts ────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.code === 'Space') { e.preventDefault(); timerRunning ? tStop() : tStart(); }
  if (e.code === 'KeyR')  { e.preventDefault(); tReset(); }
  if (e.code === 'Digit1') setMode('on');
  if (e.code === 'Digit2') setMode('off');
});

renderSchedule();
wsConnect();
</script>
</body>
</html>
